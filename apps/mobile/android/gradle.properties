# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override* any settings specified in this file.

# For more details about configuring your build environment, visit
# https://docs.gradle.org/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1536m

# Reuse cacheable task outputs across local clean/rebuild cycles.
org.gradle.caching=true

# When configured, Gradle can run independent projects in parallel.
# Keep this disabled until repository-specific measurements justify it.
# org.gradle.parallel=true

# AndroidX package structure makes it clearer which packages are bundled with the
# Android operating system and which are packaged with the app's APK.
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
